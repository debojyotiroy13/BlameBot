[project]
name = "incident-agent"
version = "0.1.0"
description = "Incident response agent that searches logs and GitHub history to suggest fixes."
requires-python = ">=3.9"
dependencies = [
    "openai>=1.50.0",
    "PyGithub>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
incident-agent = "incident_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_agent"]
